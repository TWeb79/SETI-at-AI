[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-seti"
version = "0.3.0"
description = "Parallel, AI-assisted radio technosignature search in the spirit of SETI@home"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pandas>=2.1",
  # Upper bound is load-bearing: src/ai_seti/ai/hit_classifier.joblib is a pickled
  # estimator, and scikit-learn refuses to unpickle across minor versions. Retrain the
  # artifact (`ai-seti train`) before widening this range. tests/test_model.py guards it.
  "scikit-learn>=1.8,<1.9",
  "joblib>=1.3",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
radio = ["h5py>=3.10", "hdf5plugin>=4.1"]   # Breakthrough Listen .h5 (bitshuffle)
gpu = ["cupy-cuda12x>=13"]                   # experimental, NVIDIA only
compare = ["turbo_seti>=2.3", "blimpy>=2.1"] # cross-check against the reference pipeline
dashboard = ["streamlit>=1.35"]
notebook = ["jupyterlab>=4", "ipykernel>=6"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
ai-seti = "ai_seti.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_seti = ["ai/*.joblib"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes (unused imports/variables)
  "I",    # import sorting
  "B",    # bugbear
  "UP",   # pyupgrade
  "C4",   # comprehensions
  "SIM",  # simplify
  "RUF",  # ruff-specific
]
ignore = [
  "B008",  # typer requires Option()/Argument() as parameter defaults
  "E501",  # long lines are reported by the formatter, not here
  "RUF001", # en dashes are deliberate typography in prose and docstrings
  "RUF002",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]  # literal values in assertions are the point

[tool.ruff.lint.isort]
known-first-party = ["ai_seti"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
# Third-party stubs are not installed; untyped imports must not drown real errors.
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
