name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# One group per pull request, else per commit: a PR's new push cancels its outdated run, but
# nothing on main is cancelled, least of all by re-running an old run (backlog B45).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[radio,dev]"

      - name: Lint
        run: ruff check .

      - name: Typecheck
        run: mypy

      - name: Test
        run: pytest

      - name: Coverage floor
        run: |
          pip install pytest-cov
          pytest --cov=ai_seti --cov-report=term-missing --cov-fail-under=60

  smoke:
    # The DSP and reporting paths are exercised on one Python only; this job exists to prove
    # the installed CLI actually runs end to end, which the unit tests do not cover.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[radio,dashboard,dev]"

      - name: Bundled classifier must load
        # Guards the scikit-learn upper bound in pyproject.toml: the shipped
        # hit_classifier.joblib is a pickled estimator and cannot cross minor versions.
        run: |
          python -c "
          from ai_seti.ai.model import HitScorer
          s = HitScorer()
          assert s.available, f'bundled model failed to load: {s.load_error}'
          print('bundled model OK:', s.meta.get('sklearn_version'))
          "

      - name: Demo end to end
        run: |
          ai-seti demo --n-chan 65536 --outdir reports/ci-demo
          test -f reports/ci-demo/report.html
          test -f reports/ci-demo/candidates.csv
          grep -q 'ai_class' reports/ci-demo/candidates.csv
          ! grep -q 'model_unavailable' reports/ci-demo/candidates.csv

      - name: Share a finding to a local bundle
        run: |
          ai-seti share reports/ci-demo --to bundle --min-interest 1
          test -n "$(ls reports/share/*.zip 2>/dev/null)"

      - name: Injection/recovery benchmark
        run: ai-seti benchmark --trials 2
